# On every push to main: test, build the image, and point homelab at the new tag.
# Argo CD then rolls it out. Needs the repository secret HOMELAB_TOKEN: a fine-grained
# GitHub token with "Contents: Read and write" on phyeony/homelab only.
name: release

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/phyeony/work-library

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: ':memory:'
      SESSION_SECRET: ci-only-secret-that-is-at-least-32-chars
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npx -y npm@11 ci
      - run: npm run check
      - run: npm test

  image:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ github.sha }}
            ${{ env.IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          repository: phyeony/homelab
          token: ${{ secrets.HOMELAB_TOKEN }}
      - name: Point homelab at the new image
        run: |
          file=apps/work-library/kustomization.yml
          sed -i "s|^\([[:space:]]*newTag:\).*|\1 \"${GITHUB_SHA}\"|" "$file"
          grep -q "newTag: \"${GITHUB_SHA}\"" "$file"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "work-library: deploy ${GITHUB_SHA::7}" || echo "Already up to date"
          git push
